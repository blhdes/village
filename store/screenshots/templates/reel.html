<!doctype html>
<!--
  VILLE store screenshot: caption on top, the real screen below, nothing else.
  Captions are written without their final full stop: the template adds it.
  Koubou fills {{headline}}, {{screen}}, {{appearance}} (dark | light), {{dot}} (red-dot | plain)
  and {{serif_italic}} (Source Serif 4 Italic, OFL). Canvas size comes from the Koubou config:
  1206 × 2622 (required 6.3" set) or 1320 × 2868 (6.9"). Everything is sized in vw so one
  template serves both.
  No device frame on purpose: VILLE's style prefers type and space over boxes.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "VILLE Serif";
    src: url("{{serif_italic}}");
    font-style: italic;
    font-weight: 400;
  }

  :root {
    --bg: #000000;
    --text: #f2f2f2;
    --red: #ff3534;   /* BrandRed, dark (sRGB fallback) */
    --edge: rgba(255, 255, 255, 0.14);
  }
  body.light {
    --bg: #ffffff;
    --text: #111111;
    --red: #d80017;   /* BrandRed, light (sRGB fallback) */
    --edge: rgba(0, 0, 0, 0.12);
  }

  html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
  }

  .caption {
    position: absolute;
    top: 9vw;
    left: 8vw;
    right: 8vw;
    margin: 0;
    color: var(--text);
    font-family: "VILLE Serif", "Source Serif 4", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 10.4vw;
    line-height: 1.08;
    letter-spacing: -0.01em;
  }
  .caption .dot { color: inherit; }
  body.red-dot .caption .dot { color: var(--red); }

  /* The real screen, whole (the credit line at the bottom stays visible), rounded like the display. */
  .screen {
    position: absolute;
    top: 46vw;
    left: 50%;
    width: 78vw;
    transform: translateX(-50%);
    border-radius: 9.4vw;
    box-shadow: 0 0 0 0.25vw var(--edge);
    display: block;
  }
</style>
</head>
<body class="{{appearance}} {{dot}}">
  <h1 class="caption" data-kou-id="headline" data-kou-role="headline">{{headline}}<span class="dot">.</span></h1>
  <img class="screen" data-kou-id="screen" data-kou-role="device" src="{{screen}}" alt="">
</body>
</html>

<!doctype html>
<!--
  VILLE store screenshot: caption on top, the real screen below, nothing else.
  No device frame on purpose: VILLE's style prefers type and space over boxes.

  Koubou (store/screenshots/koubou.yaml) fills:
    {{headline}}  the caption, written without its final full stop
    {{stop}}      that full stop: "." or, in Japanese and Chinese, "。"
    {{lang}}      the language, so Japanese and Chinese get their own serif
    {{screen}}    the raw capture from the iPhone
    {{look}}      look-dark.css, look-light.css or look-dark-red.css (shot 1: the red full stop)
    {{serif_italic}}, {{serif_jp}}, {{serif_sc}}  fonts, all SIL OFL (store/screenshots/fonts)

  Everything is sized in vw, so one template serves 1206 × 2622 and 1320 × 2868.
-->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{look}}">
<style>
  @font-face {
    font-family: "VILLE Serif";
    src: url("{{serif_italic}}") format("truetype");
    font-style: italic;
    font-weight: 200 900;
  }
  @font-face {
    font-family: "VILLE Serif JP";
    src: url("{{serif_jp}}") format("truetype");
    font-weight: 200 900;
  }
  @font-face {
    font-family: "VILLE Serif SC";
    src: url("{{serif_sc}}") format("truetype");
    font-weight: 200 900;
  }

  html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
  }

  .caption {
    position: absolute;
    top: 9vw;
    left: 8vw;
    right: 8vw;
    margin: 0;
    color: var(--text);
    font-family: "VILLE Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    /* Source Serif 4's optical size for display type. */
    font-variation-settings: "opsz" 60;
    font-size: 10.4vw;
    line-height: 1.08;
    letter-spacing: -0.01em;
    /* Lines break where the caption says ("\n" in captions.xcstrings), two at most,
       so the caption never reaches the screen. */
    white-space: pre-line;
  }
  .stop { color: var(--stop); }

  /* No italics in Japanese and Chinese: their own serif, upright, a little smaller. */
  :lang(ja) .caption,
  :lang(zh) .caption {
    font-style: normal;
    font-variation-settings: normal;
    font-weight: 500;
    font-size: 8.6vw;
    line-height: 1.3;
    letter-spacing: 0.02em;
  }
  /* Japanese wraps between phrases, never inside a word, if a line runs out. */
  :lang(ja) .caption { font-family: "VILLE Serif JP", serif; word-break: auto-phrase; }
  :lang(zh) .caption { font-family: "VILLE Serif SC", serif; }

  /* The real screen, whole (the actions at the bottom stay visible), rounded like the display. */
  .screen {
    position: absolute;
    top: 46vw;
    left: 50%;
    width: 78vw;
    transform: translateX(-50%);
    border-radius: 9.4vw;
    box-shadow: 0 0 0 0.25vw var(--edge);
    display: block;
  }
</style>
</head>
<body>
  <h1 class="caption" data-kou-id="headline" data-kou-role="headline">{{headline}}<span class="stop">{{stop}}</span></h1>
  <img class="screen" data-kou-id="screen" data-kou-role="device" src="{{screen}}" alt="">
</body>
</html>
